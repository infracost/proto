syntax = "proto3";

package infracost.provider;

import "infracost/provider/rational.proto";

// TODO: add comment above each field

message Output {
  // Normalised list of resources, made IaC-agnostic.
  repeated Resource resources = 1;
  // Details of passes/failures for each configured finops policy
  repeated FinopsPolicyResult finops_results = 2;
  // Details of passes/failures for each configured tagging policy
  repeated TaggingPolicyResult tagging_results = 3;
  // NOTE: Eventually we should add details of passes/failures for each configured guardrail
  reserved 4;
}

message Resource {
  // Unique resource id - this is supplied by the relevant parser
  string id = 1;
  // The resource type as supplied by the parser e.g. aws_instance or AWS::EC2::Instance
  string resource_type = 2; // tf or cfn resource type
  // TODO: resource name - usually the address of the resource?
  string name = 3;

  // region if applicable, e.g. eu-west2
  string region = 4;

  ResourceMetadata metadata = 5; // ???

  // TODO: ??? link to where the provider was defined?
  string provider_link = 6;
  // If explicitly supported by Infracost
  bool is_supported = 7;
  // If the resource has no associated costs
  bool is_free = 8;
  // If the provider of the resource is supported
  bool is_provider_supported = 9;
  // if defaults tags are supported for this resource
  bool supports_default_tags = 10;

  bool is_new = 11;
  // The resource costs - totals and individual cost components - including environmental metrics
  ResourceCosts costs = 12;
  // Resource-level tags
  map<string, string> tags = 13;
  map<string, string> default_tags = 14;
  // Child resources e.g. a disk belonging to a VM, defined as part of a greater resource
  repeated Resource child_resources = 15;
}

message ResourceMetadata {
  string basic_checksum = 1;
  string property_checksum = 2;
  string default_tags_checksum = 3;
  string filename = 4;
  int64 start_line = 5;
  int64 end_line = 6;
  repeated ModuleCall module_calls = 7;
}

message ModuleCall {
  string definition_name = 1; // i.e. block name
  string filename = 2;
  int64 start_line = 3;
  int64 end_line = 4;
}

message Tags {
  // Default tags
  repeated Tag default_tags = 1;
  // Resource-level tags
  // TODO: do these include default values?
  repeated Tag tags = 2;
  // If the provider supports default tags here (so we can differentiate between this and there being no defaults)
  bool default_tags_supported = 3;
  // List of missing (undefined) variables that result in us not knowing all tag keys
  // We use this so we can avoid report missing tags if we're unsure if the tags are really missing, as one or more tags exists with an unknown key.
  repeated string missing_vars_causing_unknown_tag_keys = 4;
  // List of missing (undefined) variables that result in us not knowing all default tag keys
  repeated string missing_vars_causing_unknown_default_tag_keys = 5;
  // Propagation data. This tells us if if the tags are propagated from one resource to another, and whether this is configured properly.
  TagPropagation propagation = 6;
}

message TagPropagation {
  // TODO: !!!
  //    To                    string             `json:"to"`
  // From                  *string            `json:"from,omitempty"`
  // Tags                  *map[string]string `json:"tags,omitempty"`
  // Attribute             string             `json:"attribute"`
  // HasRequiredAttributes bool               `json:"hasRequiredAttributes,omitempty"`
}

message ResourceCosts {
  repeated CostComponent components = 1;
}

message CostComponent {
  // Display name for cost component, but also contains some attributes e.g. Compute (t3.small, on-demand)
  string name = 1;
  // The `quantity` refers to the number of these, and the `period_price` is for each of these. e.g. if `unit` is "cores", the `period_price` is per core, and the `quantity` is the number of cores.
  string unit = 2;
  // Whether the `period_price` is based on usage data
  bool usage_based = 3;
  // Whether we found a `period_price` for this (_false_ if a custom price was used)
  bool price_not_found = 4;
  // Whether the price was hardcoded in the provider plugin, or in the usage data
  bool price_was_hardcoded = 5;
  // The price, pre-discount, of each `unit` (per price period)
  PeriodPrice period_price = 6;
  // This is the number we need to multiple `period_price` by to arrive at a pre-discounted cost
  infracost.provider.Rat quantity = 7;
  // The rate to multiply the `period_price` by to calculate savings. i.e. discounted_cost = cost - (cost * discount_rate)
  infracost.provider.Rat discount_rate = 8;
  // Information on how fast your infrastructure is destroying the planet
  EnvironmentalMetrics environmental_metrics = 9;
}

message PeriodPrice {
  infracost.provider.Rat price = 7;
  Period period = 6;
}

enum Period {
  MONTH = 0;
  HOUR = 1;
}

message EnvironmentalMetrics {
  Period period = 1;
  infracost.provider.Rat carbon_grams_co2e = 2;
  infracost.provider.Rat water_liters = 3;
}

message Tag {
  string key = 1;
  string value = 2;
}

message FinopsPolicyResult {
  string policy_id = 1;
  string policy_name = 2;
  string policy_slug = 3;
  string policy_message = 4;
  repeated string passing_resource_ids = 5;
  repeated FinopsPolicyFailingResource failing_resources = 6;
  bool block_pull_request = 7;
  bool include_in_pull_request_comment = 8;
  bool only_applies_to_new_resources = 9;
}

message FinopsPolicyFailingResource {
  string id = 1;
  repeated FinopsResourceIssue issues = 15;
}

message FinopsResourceIssue {
  infracost.provider.Rat monthly_savings = 1;
  infracost.provider.Rat monthly_carbon_savings_grams_co2e = 2;
  infracost.provider.Rat monthly_water_savings_litres = 3;
  string address = 4;
  string attribute = 5;
  string description = 6;
  optional string savings_details = 7;
}

message TaggingPolicyResult {
  string policy_id = 1;
  string policy_name = 2;
  string policy_message = 3;
  repeated string passing_resource_ids = 4;
  repeated TaggingPolicyFailingResource failing_resources = 5;
  bool block_pull_request = 6;
  bool include_in_pull_request_comment = 7;
}

message TaggingPolicyFailingResource {
  string id = 1;
  repeated InvalidTag invalid_tags = 2;
  repeated string missing_mandatory_tags = 3;
  repeated TagPropagationProblem propagation_problems = 4;
  bool default_tags_did_not_propagate = 5;
}

message TagPropagationProblem {
  string attribute = 1;
  string from = 2;
  string to = 3;
  repeated string valid_sources = 4;
  repeated string affected_tags = 5;
}

message InvalidTag {
  string key = 1;
  string value = 2;
  string message = 3;
  repeated string valid_values = 4;
  bool valid_values_truncated = 5;
  bool from_default_tags = 6;
  bool missing_mandatory = 7;
  optional string valid_regex = 8;
  optional string suggestion = 9;
}
