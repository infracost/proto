syntax = "proto3";

package infracost.provider;

import "infracost/parser/api/service.proto";
import "infracost/parser/event/runparameters.proto";
import "infracost/usage/usage.proto";

message Input {
  // The output of a parser, such as a Terraform module result, or a CloudFormation result
  infracost.parser.api.ParseResponse parse_result = 1;

  // Absolute path of the project/template being scanned
  // For Terraform/Terragrunt this will be a directory, for CFN this will be a template file
  string absolute_path = 2; // path to project

  // Specifies customer-defined (and default) usage data
  // This comes from zero or more of the cloud db, and/or a customer's committed usage file
  ProjectInfo project_info = 3;

  // Resource addresses (including module prefix) that have been seen on a previous run (if relevant), which helps us figure
  // out if a resource is to be considered "new" or not.
  // This is mainly so we can ignore policies that only want to so consider "new" resources
  repeated string previous_resource_addresses = 4;

  // usage data, usually set by combining dashboard API data with any usage file data committed in the target repo
  infracost.usage.Usage usage = 5;

  // Specifies which policies need to be run, and any custom settings for each.
  FinopsPolicyConfiguration finops_policy_config = 6;

  // Feature flags
  Features features = 7;

  // settings that affect the provider behaviour e.g. currency, disk cache usage
  Settings settings = 8;

  // infracost-specific settings such as API key, pricing endpoint, trace ID that will not apply to non-infracost plugins
  Infracost infracost = 9;
}

message Settings {
  // currency code (ISO 4217) as used in infracost config file e.g. USD, GBP, EUR
  string currency = 1;
  // whether to write caches to the disk - disable if the disk is ephemeral and caches won't persist between runs
  bool use_disk_caches = 2;
}

message Infracost {
  // infracost api key to access pricing data + recommendations
  string api_key = 1;
  // pricing api endpoint to use for price lookups + recommendations
  string pricing_api_endpoint = 2;
  // trace id for correlating requests - mainly for internal use/debugging
  string trace_id = 3;
}

message Features {
  // Enable price lookups
  bool enable_price_lookups = 1;
  // Enable recommendations
  bool enable_recommendations = 2;
  // Enable finops policy evaluations
  bool enable_finops_policies = 3;
  // Enable environmental metrics lookups
  bool enable_environmental_metrics = 4;
}

// Extra information about the project (formerly known as Scope in the runner)
message ProjectInfo {
  // Project name as it appears in the config file
  string name = 1;
  // Git branch name being scanned, if applicable
  string branch_name = 2;
  // Workspace name (currently only used for Terraform workspace)
  string workspace = 3;
  // If the environment being scanned is production (only relevant for ICP)
  bool is_production = 4;
}

message FinopsPolicyConfiguration {
  // Finops policies to evaluate (matched by slug) - if none are supplied, all available (default) policies should be run.
  repeated infracost.parser.event.FinopsPolicySettings policies = 1;
}
