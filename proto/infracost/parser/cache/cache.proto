syntax = "proto3";

package infracost.parser.cache;

import "google/protobuf/timestamp.proto";
import "infracost/parser/cloudformation/result.proto";
import "infracost/parser/diagnostic.proto";
import "infracost/parser/terraform/module.proto";
import "infracost/tree/tree.proto";
import "infracost/usage/usage.proto";

message TerraformProject {
  terraform.ModuleResult result = 1;
  Metadata metadata = 2;
  repeated parser.Diagnostic diags = 3;
  reserved 4; // deprecated
  reserved "usage_file"; // deprecated
  reserved 5; // not used
  reserved "project_config"; // not used
  bool is_terragrunt = 6;
  string terraform_module_suffix = 7;
  reserved 8; // not used
  reserved "dependency_paths"; // not used
  infracost.usage.Usage usage = 9;
  string project_type = 10;
  string config_sha = 11;
  string path = 12;
  string workspace = 13;
}

message Metadata {
  string key = 1;
  Flavor flavor = 2;
  string runner_version = 3;
  string parser_version = 4;
  google.protobuf.Timestamp created_at = 5;
}

enum Flavor {
  FLAVOR_UNSPECIFIED = 0;
  FLAVOR_TERRAFORM = 1;
  FLAVOR_CLOUDFORMATION = 2;
  FLAVOR_AGNOSTIC = 3;
}

message DependencyPaths {
  repeated string paths = 1;
}

// BranchSummary caches per-project data for a branch so that a later run of the same branch, or a
// pull request opened against it, can look each project up by name to reuse its breakdown ID, detect
// whether it changed via its stored hash, and recover its dependency paths without re-parsing.
message BranchSummary {
  string branch = 1;

  // Deprecated: superseded by the projects field below. New code must not write these; they remain
  // only so that summaries written by older code can still be read. When projects is empty (an old
  // summary), reconstruct it by joining these maps on their shared SHA key - sha_to_project_name_map
  // gives each SHA its project name, and the others supply that project's id, flavor, and deps.
  map<string, string> sha_to_id_map = 2 [deprecated = true];
  map<string, string> sha_to_project_name_map = 3 [deprecated = true];
  map<string, Flavor> sha_to_flavor_map = 4 [deprecated = true];
  map<string, DependencyPaths> sha_to_dependency_paths_map = 5 [deprecated = true];

  // Projects holds the summarised data for each project discovered in this branch, keyed by project
  // name (which is unique within a branch).
  map<string, ProjectSummary> projects = 6;
}

// ProjectSummary is the cached per-project data recorded for one project on the run that produced the
// enclosing BranchSummary.
message ProjectSummary {
  // Breakdown ID assigned by the dashboard, reused across runs while the project is unchanged.
  string breakdown_id = 1;

  // The project's BreakdownSHA from that run - the content hash used as the parse-cache key. A later
  // run compares its freshly computed hash against this to decide whether the project changed.
  string breakdown_hash = 2;

  // The project's flavor (Terraform, CloudFormation, or agnostic).
  Flavor flavor = 3;

  // The files this project depended on during its last parse, including files outside the project
  // directory. Used to decide whether changed files are relevant and to invalidate caches.
  DependencyPaths dependency_paths = 4;
}

message EncryptionEnvelope {
  bytes encrypted_dek = 1;
  bytes iv = 2;
  string encrypted_data = 3; // base64 encoded, thus string
}

message CloudFormationProject {
  cloudformation.Result result = 1;
  Metadata metadata = 2;
  repeated parser.Diagnostic diags = 3;
  reserved 4; // deprecated
  reserved "usage_file"; // deprecated
  reserved 5; // not used
  reserved "project_config"; // not used
  reserved 6; // not used
  reserved "is_cdk"; // not used
  reserved 7; // not used
  reserved "dependency_paths"; // not used
  infracost.usage.Usage usage = 8;
  string project_type = 9;
  string config_sha = 10;
  string path = 11;
}

message TreeProject {
  tree.Tree tree = 1;
  Metadata metadata = 2;
  repeated parser.Diagnostic diags = 3;
  infracost.usage.Usage usage = 4;
  string project_type = 5;
  string config_sha = 6;
  string path = 7;
  string workspace = 8;
}
