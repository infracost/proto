syntax = "proto3";

package infracost.parser.options;

message GenericOptions {
  // Identity/Naming
  // The project name to use for the output
  string project_name = 1;
  // The environment name to use for the output
  string environment_name = 2;
  // The root directory of the repository being processed
  string repo_directory = 3;
  // The temporary directory that is being worked in
  string temporary_directory = 4;
  // The directory to use for caching
  string cache_directory = 5;
  // The working directory for the parser
  string working_directory = 6;
  // The credential sets to use for authentication
  repeated CredentialSet credential_sets = 7;
  // AWS credentials to use for S3 caching
  AwsCredentials aws_credentials = 8;
  // Module address to include debug in the output for. include_dumps extends debug information provided
  Debug debug = 9;
  // Whether to use sparse checkout when cloning repositories
  bool sparse_checkout = 10;
  // Proxy router configuration
  ProxyRouter proxy_router = 11;
  // Remote module cache configuration
  RemoteModuleCacheConfig remote_module_cache_config = 12;
  // Optional request to extract dependencies for a specific resource during parsing
  optional DependencyRequest dependency_request = 13;
  // Enable http first git normalization
  bool enable_git_normalization = 14;

  // Caller-sourced options (flag/env/API): data the caller assembles that a plugin cannot derive
  // from the repo, so it is typed here rather than in the opaque raw_options blob. Each is only
  // consumed by the plugins noted; others ignore it.

  // FinOps naming-policy requirements (resource type -> required attributes). Source: org/dashboard
  // policy. Cross-plugin (any IaC with taggable resources); today read by the terraform-family plugins.
  repeated AttributeRequirement required_attributes = 15;
  // Default tags applied to all resources. Source: YOR config file / YOR_SIMPLE_TAGS env.
  // Consumed by the terraform-family plugins.
  map<string, string> default_tags = 16;
  // Flat module source map (module source -> replacement). Source: INFRACOST_TERRAFORM_SOURCE_MAP
  // env. Consumed by the terraform-family plugins. NOTE: the regex source map from the config file
  // (terraform.source_map) is user config and travels in the raw_options blob instead.
  map<string, string> source_map = 17;
  // Environment variables for parsing (e.g. TF_VAR_*, TF_WORKSPACE). Source: runtime/integration
  // env merged with the project's configured env. Consumed by the terraform-family plugins.
  map<string, string> env = 18;
  // Force module sources to resolve as local paths instead of downloading them. Source: caller flag.
  // Consumed by the terraform-family plugins.
  bool force_local_module_paths = 19;
  // The Terraform workspace to select when parsing. Source: the project's configured workspace
  // (config file / INFRACOST_TERRAFORM_WORKSPACE env). Consumed by the terraform-family plugins.
  // It is a caller-sourced runtime option, NOT part of the raw_options blob, because it is also read
  // outside the plugin (e.g. the project's workspace in the cost output / provider input).
  string workspace = 20;
  // Terraform Cloud / Enterprise identity for the project. Source: the project's configured
  // terraform.cloud.*. Consumed by the terraform-family plugins to read the remote workspace. Typed
  // (not in the raw_options blob) because it is caller-sourced and the hostname is also read by the
  // caller to pair with the token in a terraform-cloud credential_set.
  TerraformCloudConfiguration terraform_cloud_configuration = 21;
  // Transport-level authentication for fetching remote references (git-over-ssh keys, mTLS client
  // certificates, extra CA bundles, host-key policy). Source: the runner decrypts these from the job
  // event; the CLI leaves it unset and relies on the developer's own system git/ssh configuration.
  // Cross-plugin: consumed by every fetch-capable plugin (terraform-family, kubernetes). Logical
  // git-over-https credentials (username/password) travel in credential_sets, not here.
  FetchAuth fetch_auth = 22;
}

// FetchAuth carries the transport-level authentication material used to fetch remote references
// (Terraform modules, Kustomize bases, Helm chart dependencies). Previously this reached the fetcher
// only as process-global side effects (GIT_SSH_COMMAND with an -i keyfile, GIT_SSL_CERT/CAINFO, a
// permissive ssh config); it is passed explicitly now so the in-process getter applies it without
// mutating the environment or touching disk.
message FetchAuth {
  // SSH private keys (PEM) for git-over-ssh clones, matched to a host. An entry with an empty host is
  // the default, used when no host-specific key matches.
  repeated SSHKey ssh_keys = 1;
  // mTLS client certificates presented to servers that require them, matched to a host. An entry with
  // an empty host is the default.
  repeated ClientCertificate client_certificates = 2;
  // Additional CA certificates (PEM) trusted when verifying server TLS, on top of the system roots.
  repeated bytes ca_certs = 3;
  // Skip SSH host-key verification. The hosted runner sets this (its containers carry no known_hosts
  // and clone ephemeral repos, matching the current permissive ssh config); the CLI leaves it false
  // so a developer's own ~/.ssh/known_hosts is honored.
  bool insecure_skip_host_key_verify = 4;
}

// SSHKey is a git-over-ssh private key scoped to a host.
message SSHKey {
  // The host this key authenticates to; empty means use it as the default key.
  string host = 1;
  // The PEM-encoded private key.
  bytes private_key = 2;
}

// ClientCertificate is an mTLS client certificate/key pair scoped to a host.
message ClientCertificate {
  // The host this certificate is presented to; empty means use it as the default.
  string host = 1;
  // The PEM-encoded client certificate.
  bytes certificate = 2;
  // The PEM-encoded private key for the certificate.
  bytes private_key = 3;
}

// TerraformCloudConfiguration identifies the Terraform Cloud / Enterprise workspace to read. The
// plugin pairs it with its auth token by matching hostname against a credential_set's host, then
// uses organization + workspace to address the remote workspace. NOTE: this workspace is the TFC
// remote workspace, distinct from GenericOptions.workspace (the terraform CLI workspace).
message TerraformCloudConfiguration {
  // The Terraform Cloud organization.
  string organization = 1;
  // The Terraform Cloud remote workspace name.
  string workspace = 2;
  // The Terraform Cloud / Enterprise hostname (e.g. app.terraform.io); the key used to pair with the
  // credential_set that carries the token for this host.
  string hostname = 3;
}

// AttributeRequirement lists the attributes a given resource type must set for a FinOps
// naming/tagging policy.
message AttributeRequirement {
  // The resource type the requirement applies to (e.g. "aws_instance").
  string resource_type = 1;
  // The attributes that must be present on that resource type.
  repeated string attributes = 2;
}

// DependencyRequest specifies parameters for extracting resource dependencies during parsing.
// When set, the parser will use internal hooks to extract dependencies while the graph is available.
message DependencyRequest {
  // The project name to filter to (only process modules matching this project)
  string project_name = 1;
  // The resource address to get dependencies for (e.g., "module.vpc.aws_instance.web")
  string resource_address = 2;
  // Whether to include code snippets from remote modules
  bool use_remote_module_snippets = 3;
  // The working directory for path normalization
  string working_directory = 4;
}

message Debug {
  // The addresses of the resource to track debug info for
  repeated string addresses = 1;
  // Whether to include the debug dumps in the output
  bool include_dumps = 2;
}

enum CredentialType {
  // Unspecified credential type
  CREDENTIAL_TYPE_UNSPECIFIED = 0;
  // Token-based authentication
  TOKEN = 1;
  // Terraform Cloud
  TERRAFORM_CLOUD = 2;
  // git-over-https / http(s) archive basic auth (username + password/token), matched by host and
  // optional path prefix. Replaces the on-disk git credential helper for remote fetches.
  GIT_HTTP = 3;
}

message CredentialSet {
  // The access token for authentication. For GIT_HTTP this is the password (or token).
  string token = 1;
  // The host for the authentication server.
  string host = 2;
  // The type of credential
  CredentialType type = 3;
  // The username. Used by GIT_HTTP basic auth; empty for token-only credential types.
  string username = 4;
  // Optional path prefix that scopes a GIT_HTTP credential to a subset of the host (e.g. an org).
  // Empty matches any path on the host. Ignored by other credential types.
  string path = 5;
}

message RemoteModuleCacheConfig {
  // The region for the cache
  string region = 1;
  // The name of the bucket for the cache
  string bucket_name = 2;
  // The prefix for the cache files
  string prefix = 3;
  // Whether the cache is private
  bool is_private = 4;
}

message AwsCredentials {
  // The AWS access key ID
  string access_key_id = 1;
  // The AWS secret access key
  string secret_access_key = 2;
  // The AWS session token
  string access_token = 3;
  // The AWS region
  string region = 4;
}

message ProxyRouter {
  map<string, string> routes = 1;
}
