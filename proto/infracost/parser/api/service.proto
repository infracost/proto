syntax = "proto3";

package infracost.parser.api;

import "infracost/parser/cloudformation/result.proto";
import "infracost/parser/cloudformation/target.proto";
import "infracost/parser/diagnostic.proto";
import "infracost/parser/terraform/module.proto";
import "infracost/parser/terraform/target.proto";
import "infracost/parser/terragrunt/target.proto";
import "infracost/tree/tree.proto";

// The ParserService provides a gRPC API for parsing infrastructure as code files.
service ParserService {
  // Describe returns plugin metadata (name, display name, priority, supported extensions).
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  // Detect checks whether this plugin can handle the given file or directory path.
  rpc Detect(DetectRequest) returns (DetectResponse);
  // Initialize initializes the parser with supported resources.
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  // Parse takes a ParseRequest message and returns a ParseResponse message.
  rpc Parse(ParseRequest) returns (ParseResponse);
  // ParseToTree takes a ParseRequest message and returns a ParseToTreeResponse message.
  rpc ParseToTree(ParseToTreeRequest) returns (ParseToTreeResponse);
}

// ParseRequest is the unified request for all parser types.
message ParseRequest {
  // The absolute root path of the repository to be parsed
  string repo_directory = 1;
  // The absolute working directory of the project in the repository being processed
  string working_directory = 2;
  // The Target type that is being parsed. Eg; cloudformation, terraform, terragrunt
  ParseRequestTarget target = 3;
}

// ParseToTreeRequest is the unified request for all parser types.
message ParseToTreeRequest {
  // The absolute root path of the repository to be parsed
  string repo_directory = 1;
  // The absolute working directory of the project in the repository being processed
  string working_directory = 2;
  // The Target type that is being parsed. Eg; cloudformation, terraform, terragrunt
  ParseRequestTarget target = 3;
  // List of extra raw attribute values to include for the special terraform attribute-matching policies
  repeated AttributeRequirement extra_attribute_values = 4;
}

message AttributeRequirement {
  // The resource type for which the attribute is required, e.g. "aws_instance"
  string resource_type = 1;
  // The list of attribute names required for the resource type, e.g. ["ami", "instance_type"]
  repeated string attributes = 2;
}

// ParseRequestTarget is the unified target for all parser types.
message ParseRequestTarget {
  oneof value {
    // The target type for Terraform files
    terraform.Target terraform = 10;
    // The target type for Terragrunt files
    terragrunt.Target terragrunt = 11;
    // The target type for CloudFormation files
    cloudformation.Target cloudformation = 12;
  }
}

// ParseResponse is the unified response for all parser types.
message ParseResponse {
  // The diagnostics generated during parsing
  repeated Diagnostic diagnostics = 1;
  // The result of parsing the target, is one of cloudformation, terraform, terragrunt
  ParseResponseResult result = 2;
  // Dependencies extracted during parsing (if DependencyRequest was provided in options)
  repeated Dependency dependencies = 3;
}

// ParseToTreeResponse is the iac-agnostic parser response
message ParseToTreeResponse {
  // The diagnostics generated during parsing
  repeated Diagnostic diagnostics = 1;
  // The result of parsing the target as a tree structure
  tree.Tree tree = 2;
  // Dependencies extracted during parsing (if DependencyRequest was provided in options)
  repeated Dependency dependencies = 3;
}

// Dependency represents a code dependency for a Terraform resource.
// This includes file location, module context, and content for non-local dependencies.
message Dependency {
  // The path to the file containing the dependency
  string file_path = 1;
  // The starting line number of the dependency definition
  int64 line_start = 2;
  // The ending line number of the dependency definition
  int64 line_end = 3;
  // The definition of the module that contains this dependency
  string module_definition = 4;
  // True if the dependency is within a remote module
  bool is_remote_module = 5;
  // True if the dependency value is defined outside of the source code
  // (e.g., passed in terraform variable, synthesized variable)
  bool is_externally_defined = 6;
  // A raw code snippet for dependencies not locally defined
  string external_snippet = 7;
  // True if the dependency was synthesized (not from actual source)
  bool is_synthetic = 8;
  // True if this is generated (temporary files)
  bool is_generated = 9;
  // The recursion depth at which this dependency was found
  int32 depth = 10;
}

// ParseResponseResult is the unified result for all parser types.
message ParseResponseResult {
  oneof value {
    // The result type for Terraform files
    terraform.ModuleResult terraform = 1;
    // The result type for CloudFormation files
    cloudformation.Result cloudformation = 2;
  }
}

// InitializeRequest is the request for the Initialize RPC.
message InitializeRequest {
  // The supported resources for Terraform from providers
  SupportedResources terraform_supported_resources = 1;
  // The supported resources for CloudFormation from providers
  SupportedResources cloudformation_supported_resources = 2;
  // Whether to disable the GraphCache. This supports the LSP which needs
  // fast responses from the parser without getting cached values on save
  bool disable_graph_cache = 3;
}

// InitializeResponse is the response for the Initialize RPC.
message InitializeResponse {}

// SupportedResources lists the resource types supported by a parser.
message SupportedResources {
  repeated SupportedResource resource_types = 1;
}

// SupportedResource represents a single supported resource type.
message SupportedResource {
  string resource_type = 1;
}

// DescribeRequest is the request for the Describe RPC.
message DescribeRequest {}

// DescribeResponse returns metadata about this parser plugin.
message DescribeResponse {
  // Short identifier for this plugin, e.g. "terraform", "cloudformation"
  string name = 1;
  // Human-readable display name, e.g. "Terraform", "AWS CloudFormation"
  string display_name = 2;
  // Detection priority — lower values are checked first.
  // Used to resolve ambiguous files (e.g. Crossplane YAML vs plain K8s YAML).
  int32 priority = 3;
  // File extensions this plugin may handle, e.g. [".tf", ".tf.json"]
  repeated string file_extensions = 4;
  // Whether this plugin can detect and parse directories (not just individual files)
  bool supports_directories = 5;
}

// DetectRequest asks the plugin whether it can handle a given path.
message DetectRequest {
  // Absolute path to a file or directory
  string path = 1;
  // Optional: file content already read by the caller (avoids redundant I/O,
  // supports LSP virtual documents). Only set for single files, not directories.
  bytes content = 2;
  // True if the content field is populated
  bool content_provided = 3;
}

// DetectResponse indicates whether this plugin claims the given path.
message DetectResponse {
  // True if this plugin can parse the given path
  bool detected = 1;
  // The project type identifier, e.g. "terraform", "terragrunt", "cloudformation", "cdk_typescript"
  string project_type = 2;
  // How confident the detection is
  DetectConfidence confidence = 3;
}

// DetectConfidence indicates how strongly a plugin claims a path.
enum DetectConfidence {
  DETECT_CONFIDENCE_UNSPECIFIED = 0;
  // Extension-only heuristic match
  DETECT_CONFIDENCE_LOW = 1;
  // Content sniffing match (e.g. apiVersion field present)
  DETECT_CONFIDENCE_MEDIUM = 2;
  // Definitive match (e.g. schema URL, magic bytes, .tf extension)
  DETECT_CONFIDENCE_HIGH = 3;
}
