syntax = "proto3";

package infracost.parser.arm;

import "infracost/parser/address.proto";
import "infracost/parser/arm/value.proto";
import "infracost/parser/metadata.proto";
import "infracost/parser/stack.proto";

// Mirrors infracost/parser/cloudformation/result.proto with the
// substitutions required for Azure:
//
//   - Region → Location (Azure's per-resource regional field)
//   - StackID/StackName → not yet — nested-deployment support is
//     future work; when it lands, deployment_id / deployment_name go
//     here under reserved field numbers.
//   - APIVersion is Azure-specific and added on Resource so cost
//     lookup can dispatch on schema version when it matters.

message Result {
  map<string, Value> parameters = 1;
  // ARM variables, evaluated against parameters and earlier
  // variables. CloudFormation has Mappings; ARM uses Variables for
  // the same role.
  map<string, Value> variables = 2;
  map<string, bool> conditions = 3;
  map<string, Resource> resources = 4;
  map<string, Value> outputs = 5;
  repeated string dependency_paths = 6;
}

message Resource {
  // Logical ID (typically the resource name within the deployment).
  string id = 1;
  // The ARM resource type, e.g. "Microsoft.Storage/storageAccounts".
  string type = 2;
  parser.Address address = 3;
  // The whole resource object as a value tree. Mirrors how
  // CloudFormation's Resource.properties carries the bag — translators
  // drill into it via the value tree's Map navigation.
  map<string, Value> data = 4;
  map<string, Value> metadata = 5;
  parser.SourceRange source_range = 6;
  uint64 flags = 7;
  bool supported = 8;
  bool free = 9;
  parser.CallStack call_stack = 10;
  // Azure region where the resource lives.
  string location = 11;
  // True when location was inferred from the deployment scope rather
  // than authored explicitly on the resource.
  bool location_is_synthetic = 12;
  bool supports_tags = 13;
  bool supports_default_tags = 14;
  TagData tag_data = 15;
  // The Azure resource provider API version (e.g. "2023-01-01"). Not
  // present in CloudFormation; carried here so cost-lookup code can
  // dispatch on schema version when relevant.
  string api_version = 16;
  // The deployment scope (resource group, subscription, management
  // group, tenant) at which this resource lives.
  Scope scope = 17;
  // Convenient duplicate of the user-authored "name" field on the
  // resource. Equal to id for top-level resources; for hierarchical
  // child resources like Microsoft.Storage/.../queues, name is the
  // hierarchical string ("account/default/queue") that downstream
  // translators split.
  string name = 18;
}

// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX
enum Scope {
  SCOPE_RESOURCE_GROUP = 0;
  SCOPE_SUBSCRIPTION = 1;
  SCOPE_MANAGEMENT_GROUP = 2;
  SCOPE_TENANT = 3;
}

message TagData {
  uint64 flags = 1;
  repeated Tag tags = 2;
}

message Tag {
  string key = 1;
  parser.SourceRange key_source_range = 2;
  uint64 key_flags = 3;
  string value = 4;
  parser.SourceRange value_source_range = 5;
  uint64 value_flags = 6;
  bool is_default = 7;
}
