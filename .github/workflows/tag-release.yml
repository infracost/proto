name: Tag release from package.json

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

# Two runs close together would both see the tag missing and race to push it
concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    # A manual run from another branch would tag a commit that never reached main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: infracost/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.INFRACOST_CI_APP_ID }}
          private-key: ${{ secrets.INFRACOST_CI_APP_PRIVATE_KEY }}
          owner: infracost
          repositories: proto

      # The app token can push tags to this repo; GITHUB_TOKEN is read-only here
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Read version from package.json
        id: version
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # Tags are never moved, so a version that is already tagged is left alone
      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists, nothing to do"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
